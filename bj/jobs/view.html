<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>빙고 송출</title>
  <style>
    body { margin:0; background:transparent; }
    #bingo-wrap { padding:14px; }
    #bingo-grid {
      display:grid;
      grid-template-columns: repeat(5, 120px);
      gap:10px;
    }
    .bingo-cell {
      width:120px; height:120px;
      background:#fff; border-radius:14px;
      position:relative;
      font-weight:700; color:#111;
    }
    .num { position:absolute; top:8px; left:10px; font-size:14px; }
  </style>
</head>
<body>
  <div id="bingo-wrap">
    <div id="bingo-grid"></div>
  </div>

  <script>
    const grid = document.getElementById('bingo-grid')
    for (let i=1;i<=25;i++){
      const c=document.createElement('div')
      c.className='bingo-cell'
      const n=document.createElement('div')
      n.className='num'
      n.textContent=i
      c.appendChild(n)
      grid.appendChild(c)
    }
  </script>
</body>
</html>
