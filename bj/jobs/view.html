<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>빙고 송출</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<div id="bingo-grid"></div>

<script src="/assets/js/render.js"></script>
<script>
async function loadFromServer() {
  const bj =
    new URLSearchParams(location.search).get("bj") || "jobs"

  const res = await fetch(
    `https://broken-mode-e7b0.rlaxodus465.workers.dev/load?bj=${bj}`
  )

  const state = await res.json()

  if (!state) return

  window.state = state
  renderAll()
}

loadFromServer()

// 3초마다 자동 동기화 (송출용 핵심)
setInterval(loadFromServer, 3000)
</script>

</body>
</html>
