<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>빙고 설정</title>
</head>
<body>
<label>
  가로(cols)
  <input id="input-cols" type="number" value="5">
</label>
<br>

<label>
  세로(rows)
  <input id="input-rows" type="number" value="5">
</label>
<br>

<label>
  셀 크기(px)
  <input id="input-cell" type="number" value="120">
</label>
<br><br>

  <button id="btn-apply-settings">적용</button>
  <h2>빙고 설정</h2>
  <p>여기는 BJ 설정 페이지</p>
  <p>view는 OBS에 넣는 주소</p>

  <!-- 서버 저장 함수 -->
  <script src="/assets/js/action.js"></script>

 <script>
  document
    .getElementById("btn-apply-settings")
    .addEventListener("click", () => {

      const cols = Number(document.getElementById("input-cols").value)
      const rows = Number(document.getElementById("input-rows").value)
      const cellSize = Number(document.getElementById("input-cell").value)

      const state = {
        config: { cols, rows, cellSize },
        boards: [],
        currentIndex: 0
      }

      saveToServer(state)
      alert("서버에 저장됨")
    })
</script>


</body>
</html>
