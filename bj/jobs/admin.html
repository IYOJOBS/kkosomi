<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>꼬소미 빙고 관리자</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body class="admin">

<!-- 숫자 + 미션 수정 모달 -->
<div id="num-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <div class="modal-title">수정</div>

    <input
      id="num-modal-input"
      type="number"
      class="modal-input"
      placeholder="숫자"
    />

    <input
      id="mission-modal-input"
      type="text"
      class="modal-input"
      placeholder="미션 (선택)"
    />

    <div class="modal-hint">
      Enter ❌ / Ctrl+Enter 저장
    </div>

    <div class="modal-actions">
      <button id="num-modal-cancel" class="btn">취소</button>
      <button id="num-modal-save" class="btn primary">저장</button>
    </div>
  </div>
</div>

<div class="admin-shell">

  <!-- 좌측 설정 -->
  <aside class="panel">
    <h2>꼬소미 빙고</h2>
    <div class="sub">설정은 여기, 숫자/미션은 프리뷰</div>

    <section class="card">
      <div class="card-title">레이아웃</div>

      <div class="grid-2">
        <label>가로
          <input id="set-cols" type="number" min="1" max="12" />
        </label>

        <label>세로
          <input id="set-rows" type="number" min="1" max="12" />
        </label>

        <label>셀 크기
          <input id="set-cell" type="number" min="60" max="220" />
        </label>

        <label>간격
          <input id="set-gap" type="number" min="0" max="40" />
        </label>
      </div>

      <button id="btn-apply-settings" class="btn primary">
        적용하고 저장
      </button>

      <button id="btn-reset-check" class="btn">
        체크만 초기화
      </button>

      <button id="btn-reset-all" class="btn danger">
        전체 초기화
      </button>
    </section>

    <section class="card">
      <div class="card-title">텍스트 스타일</div>

      <div class="grid-2">
        <label>숫자 크기
          <input id="set-num-size" type="number" />
        </label>

        <label>숫자 색
          <input id="set-num-color" type="color" />
        </label>

        <label>미션 크기
          <input id="set-mission-size" type="number" />
        </label>

        <label>미션 색
          <input id="set-mission-color" type="color" />
        </label>
      </div>
    </section>

    <section class="card">
      <div class="card-title">배경</div>
      <input id="set-bg-url" type="text" placeholder="https://image.png" />
    </section>

    <section class="card">
      <div class="card-title">스탬프</div>
      <label>크기
        <input id="set-stamp-scale" type="number" />
      </label>
    </section>
  </aside>

  <!-- 프리뷰 -->
  <main class="stage">
    <div id="bingo-wrap">
      <div id="bingo-bg"></div>
      <div id="bingo-grid"></div>
    </div>

    <div class="stage-foot">
      송출 주소 예시:
      <strong>/bj/jobs/view?bj=jobs</strong>
    </div>
  </main>

</div>

<script src="/assets/js/action.js"></script>
<script src="/assets/js/render.js"></script>

<script>
(async () => {
  const params = new URLSearchParams(location.search)
  const bj = params.get("bj") || "jobs"

  // 🔥 기본 state (에러 원인 해결 핵심)
  window.state = {
    config: {
      cols: 4,
      rows: 4,
      cellSize: 130,
      gap: 10,

      numberSize: 40,
      numberColor: "#111111",
      missionSize: 14,
      missionColor: "#333333",

      stampScale: 85,
      backgroundUrl: ""
    },
    boards: [
      {
        cells: Array.from({ length: 16 }, (_, i) => ({
          number: i + 1,
          mission: "",
          checked: false
        }))
      }
    ],
    currentIndex: 0
  }

  // 서버 데이터 로드
  const loaded = await loadFromServer(bj)
  if (loaded) window.state = loaded
  else await saveToServer(window.state, bj)

  syncSettingsUI()
  renderAll()

  document.getElementById("btn-apply-settings").onclick = async () => {
    applySettingsFromUI()
    await saveToServer(window.state, bj)
  }

  document.getElementById("btn-reset-check").onclick = async () => {
    window.state.boards.forEach(b =>
      b.cells.forEach(c => c.checked = false)
    )
    renderAll()
    await saveToServer(window.state, bj)
  }

  document.getElementById("btn-reset-all").onclick = async () => {
    if (!confirm("전체 초기화 할까요?")) return
    window.state.boards = [makeDefaultBoard()]
    window.state.currentIndex = 0
    renderAll()
    await saveToServer(window.state, bj)
  }
})()
</script>

</body>
</html>
