<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>빙고 설정</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <h2>빙고 설정</h2>

  <label>
    가로(cols)
    <input id="set-cols" type="number" value="5" />
  </label><br>

  <label>
    세로(rows)
    <input id="set-rows" type="number" value="5" />
  </label><br>

  <label>
    셀 크기(px)
    <input id="set-cell" type="number" value="120" />
  </label><br><br>

  <button id="btn-apply-settings">적용</button>

  <hr>

  <!-- ✅ 미리보기 영역 -->
  <div id="bingo-wrap">
    <div id="bingo-grid"></div>
  </div>

  <!-- JS -->
  <script src="/assets/js/render.js"></script>
  <script src="/assets/js/action.js"></script>

  <!-- 초기화 -->
  <script>
    // ⭐ 핵심: state를 먼저 만들어야 render가 됨
    window.state = {
      config: {
        cols: 5,
        rows: 5,
        cellSize: 120
      },
      boards: [
        {
          cells: Array.from({ length: 25 }, () => ({
            checked: false
          }))
        }
      ],
      currentIndex: 0
    }

    // 최초 1회 렌더
    renderAll()

    // 적용 버튼
    document
      .getElementById("btn-apply-settings")
      .addEventListener("click", () => {
        console.log("적용 버튼 클릭됨")
        const cols = Number(document.getElementById("set-cols").value)
        const rows = Number(document.getElementById("set-rows").value)
        const cellSize = Number(document.getElementById("set-cell").value)

        window.state.config = { cols, rows, cellSize }

        const total = cols * rows
        window.state.boards[0].cells =
          Array.from({ length: total }, () => ({ checked: false }))

        renderAll()
            // 🔥 여기부터 추가
    const bj =
      new URLSearchParams(location.search).get("bj") || "jobs"

    saveToServer(window.state, bj)
  })
  </script>

</body>
</html>
