<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>빙고 설정</title>
</head>
<body>
<label>
  가로(cols)
  <input id="input-cols" type="number" value="5">
</label>
<br>

<label>
  세로(rows)
  <input id="input-rows" type="number" value="5">
</label>
<br>

<label>
  셀 크기(px)
  <input id="input-cell" type="number" value="120">
</label>
<br><br>

  <button id="btn-apply-settings">적용</button>
  <h2>빙고 설정</h2>
  <p>여기는 BJ 설정 페이지</p>
  <p>view는 OBS에 넣는 주소</p>

  <!-- 서버 저장 함수 -->
  <script src="/assets/js/action.js"></script>

  <!-- 적용 버튼 클릭 로직 -->
  <script>
    document
      .getElementById("btn-apply-settings")
      .addEventListener("click", () => {

        // 테스트용 상태 데이터
        const state = {
          config: {
            cols: 5,
            rows: 5,
            cellSize: 120
          },
          boards: [],
          currentIndex: 0
        }

        saveToServer(state)
        alert("서버에 저장 요청 보냄")
      })
  </script>

</body>
</html>
